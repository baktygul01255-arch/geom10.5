<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Үш перпендикуляр және жазықтықтар бұрышы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<style>
/* Layout: school-notebook sheet on graph paper. Sticky header, pill tabs, one card per topic
   (text left, rotatable 3D figure right), reference grid, floating pen toolbar over an ink layer. */
:root{
  --u:1.25; --k:1.15; --ul:1.12;
  --paper:#f6f8fd; --grid:#dde5f4; --surface:#ffffff; --surface-2:#eef3fc;
  --ink:#142040; --ink-2:#4b5979; --rule:#ccd6ea;
  --accent:#2447c5; --accent-ink:#ffffff; --accent-soft:rgba(36,71,197,.12);
  --margin:#d63e4f;
  --plane-a:rgba(36,71,197,.17); --edge-a:#2447c5;
  --plane-b:rgba(214,62,79,.17); --edge-b:#d63e4f;
  --plane-c:rgba(17,122,85,.17); --edge-c:#117a55;
  --good:#117a55; --good-soft:rgba(17,122,85,.12); --bad:#c2303f; --bad-soft:rgba(194,48,63,.11);
  --pen-1:#1b3fd0; --pen-2:#d3263f; --pen-3:#0f8a5f;
  --font-display:'Source Serif 4','Noto Serif',Georgia,serif;
  --font-ui:'IBM Plex Sans','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1526; --grid:#1a2742; --surface:#141d33; --surface-2:#1a2542;
    --ink:#e8eefc; --ink-2:#a2b2d4; --rule:#2b3b60;
    --accent:#86a6ff; --accent-ink:#0e1526; --accent-soft:rgba(134,166,255,.17);
    --margin:#ff8591;
    --plane-a:rgba(134,166,255,.20); --edge-a:#86a6ff;
    --plane-b:rgba(255,133,145,.20); --edge-b:#ff8591;
    --plane-c:rgba(95,211,161,.20); --edge-c:#5fd3a1;
    --good:#5fd3a1; --good-soft:rgba(95,211,161,.14); --bad:#ff8591; --bad-soft:rgba(255,133,145,.13);
    --pen-1:#8fb0ff; --pen-2:#ff8a98; --pen-3:#5fd3a1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1526; --grid:#1a2742; --surface:#141d33; --surface-2:#1a2542;
  --ink:#e8eefc; --ink-2:#a2b2d4; --rule:#2b3b60;
  --accent:#86a6ff; --accent-ink:#0e1526; --accent-soft:rgba(134,166,255,.17);
  --margin:#ff8591;
  --plane-a:rgba(134,166,255,.20); --edge-a:#86a6ff;
  --plane-b:rgba(255,133,145,.20); --edge-b:#ff8591;
  --plane-c:rgba(95,211,161,.20); --edge-c:#5fd3a1;
  --good:#5fd3a1; --good-soft:rgba(95,211,161,.14); --bad:#ff8591; --bad-soft:rgba(255,133,145,.13);
  --pen-1:#8fb0ff; --pen-2:#ff8a98; --pen-3:#5fd3a1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font:400 calc(16px*var(--u))/1.5 var(--font-ui); -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:calc(1080px*var(--u));margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-txt{min-width:0}
.brand-t{font:600 calc(21px*var(--ul))/1.1 var(--font-display);letter-spacing:-.01em;white-space:nowrap}
.brand-s{font-size:calc(12.5px*var(--u));color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{flex-wrap:wrap;display:flex;align-items:center;gap:8px;flex:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink-2);font:600 calc(13px*var(--u)) var(--font-ui);padding:0 11px;min-height:calc(38px*var(--k));cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:calc(38px*var(--k));height:calc(38px*var(--k));display:grid;place-items:center;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.icon-btn svg,.tool svg{display:block}

/* tabs */
.tabs{display:flex;gap:8px;padding-block:14px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);font:600 calc(15px*var(--u)) var(--font-ui);padding:0 16px;min-height:calc(42px*var(--k));border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* sheet */
.sheet{position:relative}
.stack{display:grid;gap:16px;padding-block:12px 24px}
.intro{margin:6px 0 0;max-width:64ch;color:var(--ink-2);font-size:calc(15.5px*var(--u))}
.src-note{margin:0;font-size:calc(12.5px*var(--u));color:var(--ink-2)}
.legend{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:0 14px}
.legend summary{cursor:pointer;font-weight:600;min-height:calc(46px*var(--k));display:flex;align-items:center}
.legend-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px;padding:2px 0 14px;margin:0;list-style:none}
.legend-g li{display:flex;gap:10px;align-items:baseline;min-width:0}
.legend-g b{font:italic 600 calc(17px*var(--u)) var(--font-display);white-space:nowrap;min-width:5.4em}
.legend-g span{font-size:calc(14px*var(--u));color:var(--ink-2)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:820px){.card{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);padding:24px;gap:30px}}
.c-text{display:flex;flex-direction:column;gap:14px;min-width:0}
.c-head{display:flex;align-items:center;gap:10px}
.tag{flex:none;background:var(--accent);color:var(--accent-ink);font:700 calc(14px*var(--u)) var(--font-ui);letter-spacing:.03em;padding:4px 10px;border-radius:8px;white-space:nowrap}
.c-head h2{margin:0;font:600 calc(22px*var(--u))/1.2 var(--font-display);text-wrap:balance}
.stmt{margin:0;font:400 calc(19px*var(--u))/1.5 var(--font-display);max-width:58ch}
.defs{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:calc(15px*var(--u));color:var(--ink-2);max-width:60ch}
.sym{margin:0;background:var(--surface-2);border-radius:10px;padding:10px 12px;font:italic 400 calc(17px*var(--u))/1.5 var(--font-display);overflow-wrap:anywhere}
.sym small{display:block;font:600 calc(11px*var(--u)) var(--font-ui);font-style:normal;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.real{border-top:1px dashed var(--rule);padding-top:12px}
.real small{font:600 calc(11px*var(--u)) var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--margin)}
.real p{margin:2px 0 0;font-size:calc(15px*var(--u));color:var(--ink-2);max-width:58ch}
.extra{margin:0;border-top:1px dashed var(--rule);padding-top:12px;font-size:calc(15px*var(--u));max-width:60ch}
.extra b{font-weight:600}
.proof{border-top:1px dashed var(--rule);padding-top:4px}
.proof summary{cursor:pointer;font-weight:600;min-height:calc(44px*var(--k));display:flex;align-items:center}
.proof ol{margin:0;padding-left:1.3em;display:grid;gap:8px;font-size:calc(15.5px*var(--u));max-width:60ch}
.proof li::marker{font-weight:600;color:var(--ink-2)}
.ref{display:inline-block;font:700 calc(12px*var(--u)) var(--font-ui);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;margin-left:4px;white-space:nowrap}

/* figure */
.c-fig{min-width:0}
.fig{margin:0;background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.fig svg.grab{cursor:grabbing}
.fig figcaption{padding:10px 14px;border-top:1px solid var(--rule);font-size:calc(14.5px*var(--u));line-height:1.45;color:var(--ink-2);min-height:5.2em}
.counts{display:flex;gap:8px;margin-top:10px}
.count{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.count span{font-size:calc(12.5px*var(--u));color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.count b{font:600 calc(22px*var(--u)) var(--font-display);font-variant-numeric:tabular-nums}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mode{border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);font:600 calc(13.5px*var(--u)) var(--font-ui);border-radius:999px;padding:0 14px;min-height:calc(38px*var(--k));cursor:pointer}
.mode[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.slider{display:flex;align-items:center;gap:12px;margin-top:10px;font-weight:600;font-size:calc(14px*var(--u))}
.slider span{white-space:nowrap;min-width:4.2em;font-variant-numeric:tabular-nums}
.slider input{flex:1;min-width:0;accent-color:var(--accent);min-height:calc(30px*var(--k))}
.fig-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;font-size:calc(12.5px*var(--u));color:var(--ink-2)}
.link-btn{border:0;background:transparent;color:var(--accent);font:600 calc(13px*var(--u)) var(--font-ui);cursor:pointer;min-height:calc(36px*var(--k));padding:0 4px}
.pl-a{fill:var(--plane-a);stroke:var(--edge-a);stroke-width:1.5;stroke-linejoin:round}
.pl-b{fill:var(--plane-b);stroke:var(--edge-b);stroke-width:1.5;stroke-linejoin:round}
.pl-c{fill:var(--plane-c);stroke:var(--edge-c);stroke-width:1.5;stroke-linejoin:round}
.pl-f{fill:var(--plane-a);stroke:none}
.ln{fill:none;stroke-linecap:round}
.ln-ink{stroke:var(--ink)} .ln-accent{stroke:var(--accent)} .ln-faint{stroke:var(--ink-2)}
.pt{fill:var(--ink);stroke:var(--surface-2);stroke-width:2}
.lbl{font:italic 600 calc(18px*var(--ul)) var(--font-display);fill:var(--ink);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.lbl-h{fill:var(--ink-2)}
.lbl-a{fill:var(--edge-a)} .lbl-b{fill:var(--edge-b)} .lbl-c{fill:var(--edge-c)} .lbl-ln{fill:var(--accent)}
.lbl-pl{font-size:calc(21px*var(--ul))}

/* reference */
.ref-tools{display:grid;gap:10px}
.search{width:100%;min-height:calc(46px*var(--k));border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(16px*var(--u)) var(--font-ui);padding:0 14px}
.search::placeholder{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rgroup{display:grid;gap:10px}
.rgroup h3{margin:6px 0 0;font:600 calc(13px*var(--u)) var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.symbtn{border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:4px 12px;min-height:calc(44px*var(--k));max-width:100%;font:italic 600 calc(24px*var(--u))/1.2 var(--font-display);cursor:pointer;text-align:left;overflow-wrap:anywhere}
.symbtn:hover{border-color:var(--accent)}
.rc-term{font:600 calc(20px*var(--u))/1.25 var(--font-display)}
.rc-src{flex:none;font:700 calc(12px*var(--u)) var(--font-ui);color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.rc-txt{margin:0;font-size:calc(15px*var(--u))}
.rc-ex{margin:0;font:italic calc(15.5px*var(--u)) var(--font-display);color:var(--ink-2);overflow-wrap:anywhere}
.rc-alt{margin:0;font-size:calc(13.5px*var(--u));color:var(--ink-2)}
.empty{padding:28px 12px;text-align:center;color:var(--ink-2)}

/* quiz */
.quiz{max-width:720px;grid-template-columns:minmax(0,1fr)!important;gap:16px}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.prog i.on{background:var(--accent)}
.q-n{font-size:calc(13px*var(--u));color:var(--ink-2);font-weight:600}
.q-t{margin:0;font:600 calc(21px*var(--ul))/1.35 var(--font-display);text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(16px*var(--u))/1.4 var(--font-ui);cursor:pointer;min-height:calc(50px*var(--k))}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:calc(12px*var(--u));font-weight:700;color:var(--ink-2)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:calc(15px*var(--u))}
.fb b.ok{color:var(--good)} .fb b.bad{color:var(--bad)}
.btn{align-self:flex-start;border:0;background:var(--accent);color:var(--accent-ink);font:600 calc(15px*var(--u)) var(--font-ui);padding:0 20px;min-height:calc(46px*var(--k));border-radius:12px;cursor:pointer}
.score{font:600 calc(40px*var(--u))/1 var(--font-display)}

/* pen */
#ink{position:absolute;left:0;top:0;z-index:5;pointer-events:none}
body[data-tool="pen"] #ink,body[data-tool="eraser"] #ink{pointer-events:auto;touch-action:none;cursor:crosshair}
body[data-tool="eraser"] #ink{cursor:cell}
.pen{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.pen-bar{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 28px rgba(8,16,40,.22)}
.tool{width:calc(38px*var(--k));height:calc(38px*var(--k));display:grid;place-items:center;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;padding:0}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool.armed{background:var(--bad);color:#fff}
.tool .dot{display:block;border-radius:50%;background:currentColor}
.tool.sw .dot{width:20px;height:20px}
.tool.sw[aria-pressed="true"]{background:transparent;border-color:var(--ink)}
.sep{width:1px;height:24px;background:var(--rule);margin:0 3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;max-width:min(92vw,420px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:calc(14px*var(--u));line-height:1.35;text-align:center;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.ang-f{fill:var(--plane-b);stroke:none}
.ang-s{fill:none;stroke:var(--edge-b);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.ln-b{stroke:var(--edge-b)} .ln-c{stroke:var(--edge-c)}
.lbl-ang{font-size:calc(17px*var(--ul))}
.brand-t{white-space:normal}
.legend-g{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.legend-g b{min-width:0;white-space:normal;flex:none;max-width:45%}
.tab{max-width:calc(100vw - 32px);white-space:normal;line-height:1.25;padding-block:6px}
.brand-t,.brand-s,.c-head h2,.c-text,.stmt,.defs li,.sym{min-width:0;overflow-wrap:break-word;hyphens:auto}
.ang-f{fill:var(--plane-b);stroke:none}
.ang-s{fill:none;stroke:var(--edge-b);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.ln-b{stroke:var(--edge-b)} .ln-c{stroke:var(--edge-c)}
.lbl-ang{font-size:calc(17px*var(--ul))}

.legend-g{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.legend-g b{min-width:0;white-space:normal;flex:none;max-width:45%}
.tab{max-width:calc(100vw - 32px);white-space:normal;line-height:1.25;padding-block:6px}
.brand-t,.brand-s,.c-head h2,.c-text,.stmt,.defs li,.sym{min-width:0;overflow-wrap:break-word;hyphens:auto}

.ln-a{stroke:var(--edge-a)}
.sol-f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.sol-f>label,.sol-o legend{font-weight:700;font-size:calc(calc(14px*var(--u))*var(--u));color:var(--ink-2)}
.sol select,.sol input[type=number]{width:100%;min-width:0;min-height:calc(44px*var(--k));border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(calc(16px*var(--u))*var(--u)) var(--font-ui);padding:0 12px}
.sol select:focus-visible,.sol input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sol input[aria-invalid="true"]{border-color:var(--edge-b)}
.sol-par{display:flex;flex-wrap:wrap;gap:10px}
.sol-n span{white-space:nowrap}.sol select{font-size:calc(calc(14.5px*var(--u))*var(--u))}
.sol-n{display:flex;align-items:center;gap:8px;flex:1 1 130px;min-width:0;font-weight:700;font-size:calc(calc(15px*var(--u))*var(--u))}
.sol-hint{color:var(--ink-2);font-size:calc(calc(13px*var(--u))*var(--u));overflow-wrap:anywhere}
.sol-objs{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.sol-o{flex:1 1 200px;min-width:0;border:1px solid var(--rule);border-radius:12px;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.sol-v{display:flex;flex-direction:column;gap:4px;font-size:calc(calc(13px*var(--u))*var(--u));color:var(--ink-2)}
.sol-ans{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:6px 0 12px}
.sol-ans small{font-weight:700;color:var(--accent);font-size:calc(calc(13px*var(--u))*var(--u))}
.sol-res{display:flex;flex-direction:column;gap:2px;min-width:0}
.sol-res .k{color:var(--ink-2);font-size:calc(calc(14px*var(--u))*var(--u))}
.sol-res b{font-size:calc(calc(18px*var(--u))*var(--u));overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.sol-res.main b{font-size:calc(calc(24px*var(--u))*var(--u))}
.sol .proof li{overflow-wrap:anywhere}

/* polyhedra */
function ngon(n,r,y,rot){var a=[],k,t;for(k=0;k<n;k++){t=rot+2*Math.PI*k/n;a.push([r*Math.cos(t),y,r*Math.sin(t)]);}return a;}
function poly(V,F,names){return {k:'poly',V:V,F:F,names:names};}
function boxPoly(hx,hy,hz,sx,sz){

     t=b.map(function(q){return [q[0]+sx,hy,q[2]+sz];});
 return poly(b.concat(t),[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]],
  ['A','B','C','D','A'+SUB,'B'+SUB,'C'+SUB,'D'+SUB]);
}
function tetraPoly(){

function prismPoly(n,obl){

 for(i=0;i<n;i++){j=(i+1)%n;F.push([i,j,n+j,n+i]);}

}
function pyramidPoly(n){

}

/* ---------- vector helpers and angle marks ---------- */
function vadd(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function vsub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function vmul(a,k){return [a[0]*k,a[1]*k,a[2]*k];}
function vdot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function vcross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function vlen(a){return Math.sqrt(vdot(a,a));}
function vunit(a){var l=vlen(a)||1;return vmul(a,1/l);}
function angDeg(a,b){var c=vdot(a,b)/(vlen(a)*vlen(b));return Math.acos(Math.max(-1,Math.min(1,c)))/D;}
function fmtN(x,d){return String(+x.toFixed(d)).replace('.',',');}
function ang(o,u,w,opt){var r={k:'ang',o:o,u:vunit(u),w:vunit(w),r:.3,sq:false,lab:'',col:'b'};for(var k in opt)r[k]=opt[k];return r;}

var CUBE_TP=[
 {id:'m1',o:[1,7],pl:[0,1,2,3],b:[0,2],ru:'AC ⊥ BD₁',kk:'AC ⊥ BD₁',

 {id:'m3',o:[0,6],pl:[0,1,2,3],b:[1,3],ru:'BD ⊥ AC₁',kk:'BD ⊥ AC₁',

 {id:'m4',o:[2,4],pl:[0,3,7,4],b:[0,7],ru:'AD₁ ⊥ CA₁',kk:'AD₁ ⊥ CA₁',
  cap:{ru:'Проекция CA₁ на плоскость ADD₁ — диагональ DA₁ (CD ⊥ ADD₁). AD₁ ⊥ DA₁ (диагонали квадрата), значит, AD₁ ⊥ CA₁.',
       kk:'CA₁-дің ADD₁ жазықтығына проекциясы — DA₁ диагоналі (CD ⊥ ADD₁). AD₁ ⊥ DA₁ (квадрат диагональдары), демек AD₁ ⊥ CA₁.'}}

function cubeThree(m){
 var P=cubeP(),V=P.V,p0=V[m.pl[0]],n=vunit(vcross(vsub(V[m.pl[1]],p0),vsub(V[m.pl[2]],p0))),d0=vdot(n,p0),
     o1=V[m.o[0]],o2=V[m.o[1]],pr=function(q){return vsub(q,vmul(n,vdot(n,q)-d0));},
     q1=pr(o1),q2=pr(o2),b1=V[m.b[0]],b2=V[m.b[1]],dp=vsub(q2,q1),db=vsub(b2,b1),
     i1=idxOf(P,q1),i2=idxOf(P,q2),pn=(i1>=0&&i2>=0)?P.names[i1]+P.names[i2]:'',
     ov=[pl(m.pl.map(function(i){return V[i];}),'c',null,0),
         ln(o1,o2,{c:'b',w:3,lab:nmv(P,m.o),le:'m',lt:.4,lo:[-18,-10]}),
         ln(q1,q2,{c:'c',w:3,lab:pn,le:'m',lt:.6,lo:[14,12]}),
         ln(b1,b2,{c:'accent',w:3,lab:nmv(P,m.b),le:'m',lt:.5,lo:[-16,12]})];
 [[o1,q1],[o2,q2]].forEach(function(pq){if(vlen(vsub(pq[0],pq[1]))>1e-6)ov.push(dashed(pq[0],pq[1]));});
 var cr=vcross(dp,db),cl=vdot(cr,cr);
 if(cl>1e-9){
  var s=vdot(vcross(vsub(b1,q1),db),cr)/cl,X=vadd(q1,vmul(dp,s));
  ov.push(rightAt(X,db,dp,.18));
 }
 P.ov=ov;return P;
}

     O=[0,yb,0],E=[s,yb,0],S=[0,yt,0];
 P.ov=[dashed(S,O,'c'),dashed(O,E,'c'),ln(S,E,{c:'b',w:2.6}),pt(O,'O',{o:[-12,12]}),pt(E,'E',{o:[14,10]}),rightAt(O,vsub(S,O),vsub(E,O),.14),ang(E,vsub(O,E),vsub(S,E),{r:.3,lab:'φ'})];

function cubePlanes(m){
 var P=cubeP(),V=P.V,E1=V[m.edge[0]],E2=V[m.edge[1]],O=lerp(E1,E2,.5),e=vunit(vsub(E2,E1)),
     u=perpTo(vsub(centroid(P,m.p1),O),e),w=perpTo(vsub(centroid(P,m.p2),O),e),phi=angDeg(u,w);
 P.ov=[pl(m.p1.map(function(i){return V[i];}),'c',null,0),pl(m.p2.map(function(i){return V[i];}),'b',null,0),
  ln(E1,E2,{c:'accent',w:3}),ln(O,vadd(O,vmul(vunit(u),.55)),{c:'ink',w:2,d:1}),ln(O,vadd(O,vmul(vunit(w),.55)),{c:'ink',w:2,d:1}),
  ang(O,u,w,{r:.3,sq:Math.abs(phi-90)<.01,lab:fmtN(phi,1)+'°'})];
 return P;
}

  fc=fc.map(function(x){return x/f.length;});

 p.F.forEach(function(f,fi){

 });
 var hid='',shown='',fills='',labels='',k,e;
 for(k in edges){

 });
 var mx=0,my=0;sc.forEach(function(s){mx+=s.x;my+=s.y;});mx/=sc.length;my/=sc.length;

var ink=$('#ink'),ctx=ink.getContext('2d'),dpr=1;

 var v=$('#view'),w=v.clientWidth,h=v.clientHeight;
 if(!w||!h)return;

function setLine(s){
 var col=colorOf(s.c);

}

 var w=ink.clientWidth,p=s.p.map(function(a){return [a[0]*w,a[1]]});

 if(p.length===1){ctx.beginPath();ctx.arc(p[0][0],p[0][1],s.w/2,0,6.2832);ctx.fill();return;}
 ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
 for(var i=1;i<p.length-1;i++){ctx.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);}
 var l=p[p.length-1];ctx.lineTo(l[0],l[1]);ctx.stroke();
}
function drawAll(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,ink.clientWidth,ink.clientHeight);

}
function pos(e){var r=ink.getBoundingClientRect();return [(e.clientX-r.left)/r.width,e.clientY-r.top];}
function eraseAt(e){
 var r=ink.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,R=15,n=strokes.length;
 for(var i=strokes.length-1;i>=0;i--){
  if(strokes[i].p.some(function(a){var dx=a[0]*r.width-x,dy=a[1]-y;return dx*dx+dy*dy<R*R;}))strokes.splice(i,1);
 }

ink.addEventListener('pointerdown',function(e){
 if(pen.tool==='off')return;
 e.preventDefault();
 try{ink.setPointerCapture(e.pointerId);}catch(x){}
 if(pen.tool==='pen'){
  cur={c:pen.color,w:SIZES[pen.size],p:[pos(e)]};strokes.push(cur);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var q=cur.p[0];setLine(cur);ctx.beginPath();ctx.arc(q[0]*ink.clientWidth,q[1],cur.w/2,0,6.2832);ctx.fill();
 }else{erasing=true;eraseAt(e);}
});
ink.addEventListener('pointermove',function(e){
 if(cur){
  var p=pos(e),l=cur.p[cur.p.length-1],w=ink.clientWidth,dx=(p[0]-l[0])*w,dy=p[1]-l[1];
  if(dx*dx+dy*dy<2.25)return;
  cur.p.push(p);
  ctx.setTransform(dpr,0,0,dpr,0,0);setLine(cur);
  ctx.beginPath();ctx.moveTo(l[0]*w,l[1]);ctx.lineTo(p[0]*w,p[1]);ctx.stroke();
 }else if(erasing){eraseAt(e);}
});

 kk:{fig:'Фигура',dims:'Өлшемдері',task:'Нені табу керек',ex:'Оқулықтағы мысалдар',ans:'Жауабы',sol:'Шешуі',obj:{pt:'Нүкте',ln:'Түзу',pn:'Жазықтық'},nth:['1-ші','2-ші','3-ші'],pt:'нүкте',cap:'Ізделінді перпендикуляр немесе кесінді қалың сызықпен көрсетілген.',bad:'Деректерді тексеріңіз',vals:'Өлшемдер оң сандар болуы керек.'}
};
state.sol=null;
ITEMS.sol={v0:{yaw:-.6,pitch:.45},def:'x',modes:[]};
function solNames(fig){return solFigure(fig,SOLFIG[fig].par.map(function(p){return p[1];})).names;}
function solSetSel(){
 var s=state.sol,names=solNames(s.fig);
 s.sel=SOLPRE[s.fig][s.kind].map(function(n){return names.indexOf(n);});
}
function solInit(){
 if(state.sol)return;
 var e0=SOLEX.filter(function(x){return x.id===SOLCFG.ex[0];})[0];
 state.sol={fig:e0.fig,par:e0.par.slice(),kind:e0.kind,sel:[],ex:e0.id};
 var nm0=solNames(e0.fig);state.sol.sel=e0.sel.map(function(n){return nm0.indexOf(n);});
}
function solKind(){return SOLKINDS.filter(function(k){return k.id===state.sol.kind;})[0];}
function solControls(){
 var s=state.sol,L=state.lang,t=SOLT[L],names=solNames(s.fig),k=solKind(),h='';
 h+='<div class="sol-f"><label for="sol-fig">'+t.fig+'</label><select id="sol-fig">'+Object.keys(SOLFIG).map(function(f){return '<option value="'+f+'"'+(f===s.fig?' selected':'')+'>'+SOLFIG[f][L]+'</option>';}).join('')+'</select></div>';
 h+='<div class="sol-f"><label>'+t.dims+'</label><div class="sol-par">'+SOLFIG[s.fig].par.map(function(p,i){
  return '<label class="sol-n"><span>'+p[0]+' =</span><input type="number" inputmode="decimal" step="any" min="0.01" id="sol-p'+i+'" data-i="'+i+'" value="'+s.par[i]+'" aria-label="'+esc(SOLFIG[s.fig].pn[L][i])+'"></label>';
 }).join('')+'</div><small class="sol-hint">'+SOLFIG[s.fig].pn[L].join(' · ')+'</small></div>';
 h+='<div class="sol-f"><label for="sol-kind">'+t.task+'</label><select id="sol-kind">'+SOLKINDS.filter(function(q){return SOLCFG.kinds.indexOf(q.id)>=0;}).map(function(q){return '<option value="'+q.id+'"'+(q.id===s.kind?' selected':'')+'>'+q[L]+'</option>';}).join('')+'</select></div>';
 var pos=0,same=k.g[0]===k.g[1];
 h+='<div class="sol-objs">'+k.g.map(function(g,gi){
  var title=t.obj[g]+(same?' '+(gi+1):''),n=GN[g],sl='';
  for(var j=0;j<n;j++){
   var idx=pos+j,opts=names.map(function(nm,vi){return '<option value="'+vi+'"'+(vi===s.sel[idx]?' selected':'')+'>'+nm+'</option>';}).join('');
   sl+='<label class="sol-v"><span>'+(n>1?t.nth[j]+' '+t.pt:t.pt)+'</span><select class="sol-sel" data-i="'+idx+'">'+opts+'</select></label>';
  }
  pos+=n;
  return '<fieldset class="sol-o"><legend>'+title+'</legend>'+sl+'</fieldset>';
 }).join('')+'</div>';
 h+='<div class="sol-f"><label>'+t.ex+'</label><div class="modes" role="group">'+SOLEX.filter(function(e){return SOLCFG.ex.indexOf(e.id)>=0;}).sort(function(x,y){return SOLCFG.ex.indexOf(x.id)-SOLCFG.ex.indexOf(y.id);}).map(function(e){
  return '<button type="button" class="mode" data-act="solex" data-id="'+e.id+'" aria-pressed="'+(s.ex===e.id)+'">'+e.tag+' · '+e[L]+'</button>';
 }).join('')+'</div></div>';
 return h;
}
function solOutHTML(out){
 var L=state.lang,t=SOLT[L];
 if(!out.ok)return '<p class="fb" role="status"><b class="bad">'+t.bad+'.</b> '+esc(out.err[L])+'</p>';
 var main=out.res.filter(function(r){return r.main;})[0]||out.res[0];
 return '<div class="sol-ans" role="status"><small>'+t.ans+'</small>'+out.res.map(function(r){return '<div class="sol-res'+(r===main?' main':'')+'"><span class="k">'+esc(r.k[L])+'</span><b>'+esc(typeof r.v==='object'?r.v[L]:r.v)+'</b></div>';}).join('')+'</div>'+
  '<details class="proof" open><summary>'+t.sol+'</summary><ol>'+out.steps.map(function(x){return '<li>'+esc(x[L])+'</li>';}).join('')+'</ol></details>';
}
function solCompute(){
 var s=state.sol,F=solFigure(s.fig,s.par),out=solveSol(F,s.kind,s.sel);
 state.solCache={F:F,out:out};
 return state.solCache;
}
function drawSol(){
 var svg=$('svg[data-fig="sol"]');if(!svg||!state.sol)return;
 var c=state.solCache||solCompute();
 svg.innerHTML=renderScene(solDraw(c.F,c.out),view('sol'));
}
function solRefresh(){
 var c=solCompute(),o=$('#solOut');
 if(o)o.innerHTML=solOutHTML(c.out);
 drawSol();
 requestAnimationFrame(sizeInk);
}
function solHTML(){
 solInit();
 var L=state.lang,t=SOLT[L],tt=T[L];
 return '<div class="stack"><p class="intro">'+tt.intro.sol+'</p>'+
  '<article class="card sol" id="card-sol"><div class="c-text"><div id="solCtl">'+solControls()+'</div></div>'+
  '<div class="c-fig"><figure class="fig"><svg data-fig="sol" viewBox="0 0 420 300" role="img" tabindex="0" aria-label="'+esc(tt.tabs.sol)+'"></svg><figcaption>'+t.cap+'</figcaption></figure>'+
  '<div class="fig-foot"><span>'+tt.hint+'</span><button type="button" class="link-btn" data-act="reset" data-id="sol">'+tt.reset+'</button></div><div class="work" aria-hidden="true"><small>'+(L==='ru'?'Место для решения':'Шешуге арналған орын')+'</small></div><div id="solOut"></div></div></article>'+
  '<p class="src-note">'+tt.srcNote+'</p></div>';
}
function solAfterRender(){solRefresh();}
function solSetEx(id){
 var e=SOLEX.filter(function(x){return x.id===id;})[0],s=state.sol,names=solNames(e.fig);
 s.fig=e.fig;s.par=e.par.slice();s.kind=e.kind;s.sel=e.sel.map(function(n){return names.indexOf(n);});s.ex=id;
 $('#solCtl').innerHTML=solControls();solRefresh();
}
document.addEventListener('change',function(e){
 var el=e.target,s=state.sol;if(!s||state.tab!=='sol')return;
 if(el.id==='sol-fig'){s.fig=el.value;s.par=SOLFIG[s.fig].par.map(function(p){return p[1];});solSetSel();s.ex=null;$('#solCtl').innerHTML=solControls();solRefresh();}
 else if(el.id==='sol-kind'){s.kind=el.value;solSetSel();s.ex=null;$('#solCtl').innerHTML=solControls();solRefresh();}
 else if(el.classList.contains('sol-sel')){s.sel[+el.dataset.i]=+el.value;s.ex=null;$$('[data-act="solex"]').forEach(function(b){b.setAttribute('aria-pressed','false');});solRefresh();}
});
document.addEventListener('input',function(e){
 var el=e.target,s=state.sol;if(!s||state.tab!=='sol'||!el.id||el.id.indexOf('sol-p')!==0)return;
 var v=parseFloat(String(el.value).replace(',','.'));
 if(!(v>0)||!isFinite(v)){el.setAttribute('aria-invalid','true');return;}
 el.removeAttribute('aria-invalid');
 s.par[+el.dataset.i]=v;s.ex=null;$$('[data-act="solex"]').forEach(function(b){b.setAttribute('aria-pressed','false');});solRefresh();
});
document.addEventListener('click',function(e){
 var el=e.target.closest&&e.target.closest('[data-act="solex"]');if(!el)return;
 solSetEx(el.dataset.id);
});

/* ---------- boot ---------- */
function fullRender(){
 var L=state.lang,t=T[L];
 document.documentElement.lang=L==='kk'?'kk':'ru';
 $('#bt').textContent=t.title;$('#bs').textContent=t.sub;
 $$('.seg button[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===L));});
 applySize();
 renderTabs();renderTheme();loadStrokes();renderView();renderPen();
 requestAnimationFrame(sizeInk);
}
fullRender();
if(window.ResizeObserver)new ResizeObserver(function(){sizeInk();}).observe($('#view'));
window.addEventListener('resize',sizeInk);
})();
</script>
<script>
/* subscript fallback: Unicode ₀-₉ -> real <sub>/<tspan> (fonts of some touch panels lack these glyphs) */
(function(){
var RE=/[₀-₉]+/, RG=/([₀-₉]+)/g, SV='http://www.w3.org/2000/svg';
function dig(s){return s.replace(/[₀-₉]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x2080+48);});}
function inSvg(n){var p=n.parentNode;while(p&&p.nodeType===1){if(p.namespaceURI===SV)return true;p=p.parentNode;}return false;}
function fix(t){
 var par=t.parentNode;if(!par||!RE.test(t.nodeValue))return;
 var tag=par.nodeName.toLowerCase();
 if(tag==='script'||tag==='style'||tag==='textarea')return;
 if(tag==='option'||tag==='title'){t.nodeValue=dig(t.nodeValue);return;}
 var parts=t.nodeValue.split(RG),frag=document.createDocumentFragment(),svg=inSvg(t),i,sub;
 for(i=0;i<parts.length;i++){
  if(!parts[i])continue;
  sub=(i%2===1);
  if(svg){
   var ts=document.createElementNS(SV,'tspan');
   if(sub){ts.setAttribute('dy','0.28em');ts.setAttribute('font-size','72%');ts.textContent=dig(parts[i]);}
   else{ts.textContent=parts[i];if(i>1)ts.setAttribute('dy','-0.28em');}
   frag.appendChild(ts);
  }else if(sub){var s=document.createElement('sub');s.className='sbx';s.textContent=dig(parts[i]);frag.appendChild(s);}
  else frag.appendChild(document.createTextNode(parts[i]));
 }
 par.replaceChild(frag,t);
}
function walk(n){
 if(n.nodeType===3){fix(n);return;}
 if(n.nodeType!==1)return;
 var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null),a=[],x;
 while((x=w.nextNode()))if(RE.test(x.nodeValue))a.push(x);
 a.forEach(fix);
}
var st=document.createElement('style');st.textContent='sub.sbx{font-size:.72em;line-height:0;vertical-align:baseline;position:relative;top:.28em}';document.head.appendChild(st);
var busy=false;
new MutationObserver(function(ms){
 if(busy)return;busy=true;
 ms.forEach(function(m){
  if(m.type==='characterData')fix(m.target);
  else m.addedNodes.forEach(walk);
 });
 busy=false;
}).observe(document.body||document.documentElement,{childList:true,subtree:true,characterData:true});
walk(document.body||document.documentElement);
})();
</script>
